name: Default Updatecli policies

values:
  - updatecli/values.d/scm.yaml

policies:
  - name: Local Policies
    id: local
    config:
      - "updatecli/updatecli.d"

  - name: Update golangci-lint
    id: golangci-lint
    policy: ghcr.io/updatecli/policies/golangci-lint/githubaction:0.9.0@sha256:caccf9fe8fd42ffb113bf949cdf00f0bace80df1e59eadbd3cfcfbbfe5271161

  - name: Update Updatecli policies
    id: root_updatecli_policies
    policy: ghcr.io/updatecli/policies/updatecli/autodiscovery:0.9.0@sha256:67026697434a99f6e01a662caa662e8ed02e39e8abf8f7399ab673d113abb360
    valuesinline:
      pipeline:
        labels:
          ecosystem: updatecli
          monitor: active

  - name: Handle Updatecli version in GitHub action
    id: updatecli
    policy: ghcr.io/updatecli/policies/updatecli/githubaction:0.10.0@sha256:666a807c7e1f260fa3d9357fd2b60c57f5dedbd6f29f97b6f82d882ed4058608
    valuesinline:
      pipeline:
        labels:
          ecosystem: updatecli
          monitor: active

  - name: Install Zizmor
    id: zizmor
    policy: ghcr.io/updatecli/policies/zizmor/githubaction/scaffold:0.8.0@sha256:bacfadbe8803346402b059bc265e6c9d989d25143ed92a5dedf6012b0183650a
    valuesinline:
      config:
        rules:
          secrets-outside-env:
            disable: true

  - name: Install Typos
    id: typos
    policy: ghcr.io/updatecli/policies/typos/githubaction:0.1.2@sha256:bd052609cded659c90dd1d3a60ebc5f1368b0f93aac5adf8ff13c3250e97f161
